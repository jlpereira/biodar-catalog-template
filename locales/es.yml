    # Palabras clave de estatus de plaga. TaxonWorks guarda solo el
    # término en inglés y su color, así que la redacción vive acá,
    # indexada por ese término. El orden en que la página los muestra
    # es la escala de severidad de
    # pages/composables/useRegionKeywords.js, no esta lista.
    keywords:
      major_pest_of_many_crops: Plaga mayor de varios cultivos
      pest_regularly_of_importance: Plaga regularmente de importancia
      pest_occasionally_of_importance: Plaga ocasionalmente de importancia

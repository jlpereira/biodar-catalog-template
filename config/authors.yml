      es: Div. Entomología, Museo de La Plata; CEPAVE CONICET-UNLP, La Plata - Argentina
    url:

  - name: Carlos E. Lange
    affiliation:
      en: Centro de Estudios Parasitológicos y de Vectores (CEPAVE), CIC-CONICET-UNLP, La Plata - Argentina
      es: Centro de Estudios Parasitológicos y de Vectores (CEPAVE), CIC-CONICET-UNLP, La Plata - Argentina
    url:

